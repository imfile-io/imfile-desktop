allowBuilds:
  '@parcel/watcher': true
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true

# pnpm 11 默认 1440 分钟（1 天）；显式声明以便与 Renovate minimumReleaseAge 对齐
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - postcss
  - axios@1.19.0
  - globals@17.9.0
  - unplugin-auto-import@21.1.0

peerDependencyRules:
  allowedVersions:
    # @vue/eslint-config-standard@9 尚未声明 eslint 10，但 flat config 已兼容
    eslint: '10'

overrides:
  punycode: 2.3.1
  # CVE: host confusion via literal backslash authority delimiter (fixed in 3.1.4)
  fast-uri: ^4.0.0
  # CVE: removeScripts 未完全清除可执行脚本 (fixed in 4.0.2)
  svgo: ^4.0.2
  # CVE GHSA-mh99-v99m-4gvg: brace-expansion DoS
  brace-expansion@1.1.16: 5.0.9
  brace-expansion@2.1.2: 2.1.4
  brace-expansion@4.0.1: 5.0.9
  # CVE GHSA-r292-9mhp-454m: tar 递归 DoS
  tar: '>=7.5.21'

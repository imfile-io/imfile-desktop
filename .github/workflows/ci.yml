name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm run test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application (electron-vite)
        run: pnpm run build:github

      - name: 验证 electron-vite 构建产物
        run: |
          set -e
          test -f dist/electron/main.js
          test -f dist/electron/index.html
          test -f dist/electron/package.json
          if grep -qE 'src="\./assets/' dist/electron/index.html; then
            echo "OK: electron-vite 渲染产物使用相对路径 ./assets/"
          else
            echo "ERROR: electron-vite 渲染产物路径异常，Electron file:// 下可能无法加载脚本"
            exit 1
          fi
          if grep -qE 'src="/' dist/electron/index.html; then
            echo "ERROR: index.html 含绝对路径 src=\"/，安装包会白屏"
            exit 1
          fi

      - name: Build application (webpack release path)
        run: node .electron-vue/build.mjs
        env:
          NODE_ENV: production
          CI: true

      - name: 验证 webpack 发布产物
        run: |
          set -e
          test -f dist/electron/main.js
          test -f dist/electron/index.html
          test -f dist/electron/index.js
          if grep -q 'type="module"' dist/electron/index.html; then
            echo "ERROR: webpack 渲染入口不应使用 type=module（file:// 下 require/懒加载会失败，只剩骨架）"
            exit 1
          fi
          if grep -qE 'src="/' dist/electron/index.html; then
            echo "ERROR: index.html 含绝对路径 src=\"/，安装包会白屏"
            exit 1
          fi
          if grep -qE 'from ['\''"]ws['\''"]' dist/electron/index.js; then
            echo "ERROR: 渲染 bundle 仍静态导入 ws，asar 中 require 会失败"
            exit 1
          fi
          echo "OK: webpack 发布产物为经典脚本相对路径。"
